"Number Bases":`
<h2>Topic 1: Number Bases</h2>

<h3>Lesson</h3>
<p>
A number base tells us how many digits are used in a number system.
The decimal system is base 10 and uses the digits 0–9.
Binary is base 2 and uses only 0 and 1.
</p>

<div class="formula">
In base n, place values are n⁰, n¹, n², n³, ...
</div>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Convert 1011₂ to base 10.<br><br>
1011₂ = (1×2³)+(0×2²)+(1×2¹)+(1×2⁰)<br>
= 8 + 0 + 2 + 1<br>
= <b>11₁₀</b>
</div>

<div class="example">
<b>Example 2:</b> Convert 25₁₀ to base 2.<br><br>
25÷2 = 12 remainder 1<br>
12÷2 = 6 remainder 0<br>
6÷2 = 3 remainder 0<br>
3÷2 = 1 remainder 1<br>
1÷2 = 0 remainder 1<br><br>
Read from bottom to top:<br>
<b>25₁₀ = 11001₂</b>
</div>

<h3>Practice Questions</h3>
<div class="question">1. Convert 1101₂ to base 10.</div>
<div class="question">2. Convert 18₁₀ to base 2.</div>
<div class="question">3. Convert 123₄ to base 10.</div>

<h3>Answers</h3>
<div class="answer">
1. 13₁₀<br>
2. 10010₂<br>
3. 27₁₀
</div>

"Fractions":`
<h2>Topic 2: Fractions</h2>

<h3>Lesson</h3>
<p>
A fraction represents part of a whole. The numerator is the top number
and the denominator is the bottom number.
</p>

<div class="formula">
Fraction = Numerator ÷ Denominator
</div>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Add 2/3 + 1/6.<br><br>
LCM = 6<br>
2/3 = 4/6<br>
4/6 + 1/6 = <b>5/6</b>
</div>

<div class="example">
<b>Example 2:</b> Subtract 5/6 − 1/4.<br><br>
LCM = 12<br>
5/6 = 10/12<br>
1/4 = 3/12<br>
10/12 − 3/12 = <b>7/12</b>
</div>

<div class="example">
<b>Example 3:</b> Multiply 3/5 × 10/9.<br><br>
= 30/45<br>
= <b>2/3</b>
</div>

<h3>Practice Questions</h3>
<div class="question">1. 1/2 + 1/4</div>
<div class="question">2. 7/8 − 1/4</div>
<div class="question">3. 2/3 × 9/4</div>

<h3>Answers</h3>
<div class="answer">
1. 3/4<br>
2. 5/8<br>
3. 3/2 = 1½
</div>

Approximation means replacing a number with a nearby value that is

<p>

</div>

<div class="example">

= <b>8√2</b>
</div>

<h3>Practice Questions</h3>
<div class="question">1. Simplify √18.</div>
<div class="question">2. Simplify √75.</div>
<div class="question">3. Simplify 4√3 + 2√3.</div>

</p>

108 = 36×3<br>

</div>

√8 = 2√2<br>
√18 = 3√2<br>

</div>

<div class="example">
<b>Example 4:</b> Rationalize 1/√3.<br><br>

<h2>Topic 15: Venn Diagrams</h2>

<h3>Lesson</h3>
<p>
A Venn diagram represents sets using circles inside a rectangle.
The rectangle normally represents the universal set.
</p>

<div class="formula">
n(A∪B)=n(A)+n(B)−n(A∩B)
</div>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b><br>
In a class of 40 students, 25 like Mathematics,
18 like Physics and 10 like both.<br><br>

n(M∪P)=25+18−10<br>
= <b>33</b>
</div>

<div class="example">
<b>Example 2:</b><br>
Mathematics only = 25−10<br>
= <b>15</b>
</div>

<div class="example">
<b>Example 3:</b><br>
Physics only = 18−10<br>
= <b>8</b>
</div>

<div class="example">
<b>Example 4:</b><br>
Neither = 40−33<br>
= <b>7</b>
</div>

<h3>Practice Questions</h3>
<div class="question">
1. In a group of 50 students, 30 study Mathematics,
25 study Biology and 15 study both. Find the number studying at least one.
</div>

<div class="question">2. Find Mathematics only.</div>
<div class="question">3. Find Biology only.</div>
<div class="question">4. Find neither subject.</div>

<h3>Answers</h3>
<div class="answer">
1. 40<br>
2. 15<br>
3. 10<br>
4. 10
</div>

<h3>Lesson</h3>

An algebraic expression is a combination of numbers, variables and
mathematical operations.
</p>

<p>
Examples include:
<b>3x + 5</b>, <b>2a − 7</b>, <b>4x² + 3x − 1</b>.
</p>

<h3>Important Terms</h3>

<ul>
<li><b>Variable:</b> A letter representing an unknown quantity.</li>
<li><b>Coefficient:</b> The number multiplying a variable.</li>
<li><b>Constant:</b> A number without a variable.</li>
<li><b>Term:</b> A part of an expression separated by + or − signs.</li>
<li><b>Like terms:</b> Terms having the same variables with the same powers.</li>
</ul>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Identify the terms, coefficient and constant in
5x + 7.<br><br>

Terms = 5x and 7<br>
Coefficient of x = <b>5</b><br>
Constant = <b>7</b>
</div>

<div class="example">
<b>Example 2:</b> Simplify 3x + 5x.<br><br>
Both are like terms.<br>
3x + 5x = (3+5)x<br>
= <b>8x</b>
</div>

<div class="example">
<b>Example 3:</b> Simplify 7a − 3a + 2a.<br><br>
= (7−3+2)a<br>
= 6a<br>
Therefore <b>6a</b>
</div>

<div class="example">
<b>Example 4:</b> Simplify 4x + 3y − 2x + 5y.<br><br>
Collect x terms:<br>
4x−2x = 2x<br><br>
Collect y terms:<br>
3y+5y = 8y<br><br>
Answer = <b>2x + 8y</b>
</div>

<div class="example">
<b>Example 5:</b> Evaluate 3x + 4 when x=5.<br><br>
3(5)+4<br>
=15+4<br>
= <b>19</b>
</div>

<h3>Practice Questions</h3>

<div class="question">1. Simplify 4x + 7x.</div>
<div class="question">2. Simplify 9a − 4a + 2a.</div>
<div class="question">3. Simplify 5x + 3y − 2x + 4y.</div>
<div class="question">4. Evaluate 2x + 7 when x=6.</div>
<div class="question">5. Identify the coefficient of y in 8y−3.</div>

<h3>Answers</h3>

<div class="answer">
1. 11x<br>
2. 7a<br>
3. 3x + 7y<br>
4. 19<br>
5. 8
</div>
`,

/* =====================================================
TOPIC 17

"Expansion of Algebraic Expressions":`
<h2>Topic 17: Expansion of Algebraic Expressions</h2>

<h3>Lesson</h3>

<p>
Expansion means removing brackets by multiplying every term inside a
bracket by the term outside it.
</p>

<div class="formula">
a(b+c) = ab + ac
<br><br>
(a+b)(c+d) = ac + ad + bc + bd
</div>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Expand 3(x+4).<br><br>
Multiply 3 by every term:<br>
3×x + 3×4<br>
= <b>3x + 12</b>
</div>

<div class="example">
<b>Example 2:</b> Expand 5(2x−3).<br><br>
= 5×2x + 5×(−3)<br>
= 10x−15<br>
Therefore <b>10x−15</b>
</div>

<div class="example">
<b>Example 3:</b> Expand (x+2)(x+3).<br><br>
x×x = x²<br>
x×3 = 3x<br>
2×x = 2x<br>
2×3 = 6<br><br>
Therefore:<br>
x²+3x+2x+6<br>
= <b>x²+5x+6</b>
</div>

<div class="example">
<b>Example 4:</b> Expand (2x+3)(x+4).<br><br>
2x×x = 2x²<br>
2x×4 = 8x<br>
3×x = 3x<br>
3×4 = 12<br><br>
= 2x²+8x+3x+12<br>
= <b>2x²+11x+12</b>
</div>

<div class="example">
<b>Example 5:</b> Expand (x−5)².<br><br>
(x−5)(x−5)<br>
= x²−5x−5x+25<br>
= <b>x²−10x+25</b>
</div>

<h3>Practice Questions</h3>

<div class="question">1. Expand 4(x+5).</div>
<div class="question">2. Expand 3(2x−7).</div>
<div class="question">3. Expand (x+4)(x+2).</div>
<div class="question">4. Expand (x−3)(x+5).</div>
<div class="question">5. Expand (2x+1)(x+3).</div>

<h3>Answers</h3>

<div class="answer">
1. 4x+20<br>
2. 6x−21<br>
3. x²+6x+8<br>
4. x²+2x−15<br>
5. 2x²+7x+3
</div>
`,

/* =====================================================
TOPIC 18
===================================================== */

"Factorization":`
<h2>Topic 18: Factorization</h2>

<h3>Lesson</h3>

<p>
Factorization is the reverse of expansion. It involves expressing an
algebraic expression as a product of factors.
</p>

<h3>Common Factor</h3>

<div class="example">
<b>Example 1:</b> Factorize 6x + 12.<br><br>
The highest common factor is 6.<br>
6x + 12 = 6(x + 2)<br>
Therefore <b>6(x+2)</b>
</div>

<div class="example">
<b>Example 2:</b> Factorize 8x² + 12x.<br><br>
HCF = 4x<br>
8x² ÷ 4x = 2x<br>
12x ÷ 4x = 3<br><br>
Answer = <b>4x(2x+3)</b>
</div>

<h3>Factorizing Quadratics</h3>

<p>
For an expression of the form:
</p>

<div class="formula">
x² + bx + c
</div>

<p>
Find two numbers whose product is c and whose sum is b.
</p>

<div class="example">
<b>Example 3:</b> Factorize x² + 5x + 6.<br><br>
We need two numbers whose product is 6 and sum is 5.<br>
The numbers are 2 and 3.<br><br>
Therefore:<br>
x²+5x+6 = <b>(x+2)(x+3)</b>
</div>

<div class="example">
<b>Example 4:</b> Factorize x² − 7x + 12.<br><br>
Numbers with product 12 and sum −7 are −3 and −4.<br><br>
Therefore:<br>
x²−7x+12 = <b>(x−3)(x−4)</b>
</div>

<div class="example">
<b>Example 5:</b> Factorize x² − 9.<br><br>
This is a difference of two squares:<br>
x²−3²<br>
= <b>(x−3)(x+3)</b>
</div>

<h3>Practice Questions</h3>

<div class="question">1. Factorize 10x+15.</div>
<div class="question">2. Factorize 6x²+9x.</div>
<div class="question">3. Factorize x²+7x+12.</div>
<div class="question">4. Factorize x²−9x+20.</div>
<div class="question">5. Factorize x²−16.</div>

<h3>Answers</h3>

<div class="answer">
1. 5(2x+3)<br>
2. 3x(2x+3)<br>
3. (x+3)(x+4)<br>
4. (x−4)(x−5)<br>
5. (x−4)(x+4)
</div>
`,

"Linear Equations":`
<h2>Topic 19: Linear Equations</h2>

<h3>Lesson</h3>

<p>
A linear equation is an equation in which the highest power of the
unknown is 1.
</p>

<p>
Examples include:
<b>2x+5=13</b> and <b>5x−7=18</b>.
</p>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Solve x+7=12.<br><br>
Subtract 7 from both sides:<br>
x = 12−7<br>
Therefore <b>x=5</b>
</div>

<div class="example">
<b>Example 2:</b> Solve 3x=21.<br><br>
Divide both sides by 3:<br>
x = 21/3<br>
Therefore <b>x=7</b>
</div>

<div class="example">
<b>Example 3:</b> Solve 2x+5=17.<br><br>
2x = 17−5<br>
2x = 12<br>
x = 12/2<br>
Therefore <b>x=6</b>
</div>

<div class="example">
<b>Example 4:</b> Solve 5x−8=27.<br><br>
5x = 27+8<br>
5x = 35<br>
x = 35/5<br>
Therefore <b>x=7</b>
</div>

<div class="example">
<b>Example 5:</b> Solve 3(x+2)=18.<br><br>
Divide by 3:<br>
x+2=6<br>
x=6−2<br>
Therefore <b>x=4</b>
</div>

<div class="example">
<b>Example 6:</b> Solve 2x+5=x+12.<br><br>
Subtract x from both sides:<br>
x+5=12<br>
Subtract 5:<br>
x=<b>7</b>
</div>

<h3>Practice Questions</h3>

<div class="question">1. Solve x+9=15.</div>
<div class="question">2. Solve 4x=28.</div>
<div class="question">3. Solve 3x+4=19.</div>
<div class="question">4. Solve 7x−5=30.</div>
<div class="question">5. Solve 2(x+4)=18.</div>
<div class="question">6. Solve 5x+3=2x+18.</div>

<h3>Answers</h3>

<div class="answer">
1. x=6<br>
2. x=7<br>
3. x=5<br>
4. x=5<br>
5. x=5<br>
6. x=5
</div>
`,

/* =====================================================

"Linear Inequalities":`
<h2>Topic 20: Linear Inequalities</h2>

<h3>Lesson</h3>

<p>
An inequality compares two quantities. The common inequality symbols
are:
</p>

<div class="formula">
&gt; means greater than<br>
&lt; means less than<br>
≥ means greater than or equal to<br>
≤ means less than or equal to
</div>

<p>
The method of solving an inequality is similar to solving an equation.
However, when multiplying or dividing by a negative number, the
inequality sign must be reversed.
</p>

<h3>Worked Examples</h3>

<div class="example">
<b>Example 1:</b> Solve x+3 &gt; 7.<br><br>
Subtract 3 from both sides:<br>
x &gt; 4<br>
Therefore <b>x &gt; 4</b>
</div>

<div class="example">
<b>Example 2:</b> Solve 2x &lt; 10.<br><br>
Divide by 2:<br>
x &lt; 5<br>
Therefore <b>x &lt; 5</b>
</div>

<div class="example">
<b>Example 3:</b> Solve 3x+4 ≥ 16.<br><br>
3x ≥ 16−4<br>
3x ≥ 12<br>
x ≥ 4<br>
Therefore <b>x ≥ 4</b>
</div>

<div class="example">
<b>Example 4:</b> Solve 5x−7 ≤ 18.<br><br>
5x ≤ 25<br>
x ≤ 5<br>
Therefore <b>x ≤ 5</b>
</div>

<div class="example">
<b>Example 5:</b> Solve −2x &gt; 8.<br><br>
Divide both sides by −2.<br>
Because we divide by a negative number, reverse the sign:<br>
x &lt; −4<br>
Therefore <b>x &lt; −4</b>
</div>

<div class="example">
<b>Example 6:</b> Solve 2x+3 &lt; x+9.<br><br>
Subtract x:<br>
x+3 &lt; 9<br>
Subtract 3:<br>
x &lt; <b>6</b>
</div>

<h3>Practice Questions</h3>

<div class="question">1. Solve x+5 &gt; 11.</div>
<div class="question">2. Solve 3x &lt; 18.</div>
<div class="question">3. Solve 2x+7 ≥ 15.</div>
<div class="question">4. Solve 4x−3 ≤ 17.</div>
<div class="question">5. Solve −3x &gt; 12.</div>
<div class="question">6. Solve 2x+1 &lt; x+8.</div>

<h3>Answers</h3>

<div class="answer">
1. x &gt; 6<br>
2. x &lt; 6<br>
3. x ≥ 4<br>
4. x ≤ 5<br>
5. x &lt; −4<br>
6. x &lt; 7
</div>

<h3>Important Reminder</h3>
<p>
Whenever an inequality is multiplied or divided by a negative number,
<b>reverse the inequality sign</b>.
</p>
`

/* =====================================================

function startLearning(){
    document.getElementById("welcomeSection").classList.add("hidden");
    showTopics();
}

function showTopics(){
    document.getElementById("welcomeSection").classList.add("hidden");
    document.getElementById("lessonSection").classList.add("hidden");
    document.getElementById("topicsSection").classList.remove("hidden");
    displayTopics();
}

function displayTopics(){

    const list = document.getElementById("topicsList");

    list.innerHTML = "";

    topics.forEach((topic,index)=>{

        const div = document.createElement("div");

        div.className = "topic";

        div.innerHTML =
            (index+1) + ". " + topic;

        div.onclick = function(){
            openLesson(index);
        };

        list.appendChild(div);

    });
}

function openLesson(index){

    const topic = topics[index];

    document.getElementById("topicsSection")
        .classList.add("hidden");

    document.getElementById("welcomeSection")
        .classList.add("hidden");

    document.getElementById("lessonSection")
        .classList.remove("hidden");

    document.getElementById("lessonContent").innerHTML =
        `<div class="lesson-card">${lessons[topic]}</div>`;

    window.scrollTo(0,0);
}

function showWelcome(){

    document.getElementById("topicsSection")
        .classList.add("hidden");

    document.getElementById("lessonSection")
        .classList.add("hidden");

    document.getElementById("welcomeSection")
        .classList.remove("hidden");
}

window.onload = function(){
    showWelcome();
};

</script>
