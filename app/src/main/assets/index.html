/* =====================================================

"Change of Subject of Formula":`

<h2>Topic 21: Change of Subject of Formula</h2>

<h3>Lesson</h3>

<p>
Changing the subject of a formula means rearranging a formula so that
a different variable is alone on one side of the equation.
</p>

<p>
The basic rule is that whatever operation is performed on one side must
also be performed on the other side.
</p>

<div class="formula">
Example:<br>
y = 3x + 5<br>
To make x the subject:<br>
x = (y − 5)/3
</div>

<h3>Worked Examples</h3>

<div class="example">

<b>Example 1:</b> Make x the subject of:

<br><br>

y = 4x + 7

<br><br>

Subtract 7 from both sides:

<br>

y − 7 = 4x

<br><br>

Divide by 4:

<br>

<b>x = (y − 7)/4</b>

</div>

<div class="example">

<b>Example 2:</b> Make r the subject of:

<br><br>

C = 2πr

<br><br>

Divide both sides by 2π:

<br>

<b>r = C/(2π)</b>

</div>

<div class="example">

<b>Example 3:</b> Make x the subject of:

<br><br>

y = (x + 3)/5

<br><br>

Multiply both sides by 5:

<br>

5y = x + 3

<br><br>

Subtract 3:

<br>

<b>x = 5y − 3</b>

</div>

<div class="example">

<b>Example 4:</b> Make h the subject of:

<br><br>

A = ½bh

<br><br>

Multiply by 2:

<br>

2A = bh

<br><br>

Divide by b:

<br>

<b>h = 2A/b</b>

</div>

<div class="example">

<b>Example 5:</b> Make x the subject of:

<br><br>

a = (x − b)/c

<br><br>

Multiply by c:

<br>

ac = x − b

<br><br>

Add b:

<br>

<b>x = ac + b</b>

</div>

<h3>Practice Questions</h3>

<div class="question">
1. Make x the subject of y = 5x + 2.
</div>

<div class="question">
2. Make r the subject of A = πr².
</div>

<div class="question">
3. Make h the subject of V = lwh.
</div>

<div class="question">
4. Make x the subject of y = (2x+1)/3.
</div>

<div class="question">
5. Make b the subject of A = ½(a+b)h.
</div>

<h3>Answers</h3>

<div class="answer">

1. x = (y−2)/5<br><br>

2. r = √(A/π)<br><br>

3. h = V/(lw)<br><br>

4. x = (3y−1)/2<br><br>

5. b = 2A/h − a

</div>
`,

/* =====================================================
TOPIC 22
===================================================== */

"Simultaneous Linear Equations":`

<h2>Topic 22: Simultaneous Linear Equations</h2>

<h3>Lesson</h3>

<p>
Simultaneous equations are two or more equations containing unknown
variables that must be solved together.
</p>

<p>
Two common methods are:
</p>

<ul>
<li>Elimination method</li>
<li>Substitution method</li>
</ul>

<h3>Worked Examples</h3>

<div class="example">

<b>Example 1: Elimination Method</b>

<br><br>

Solve:

<br>

x + y = 9

<br>

x − y = 3

<br><br>

Add the equations:

<br>

2x = 12

<br>

x = 6

<br><br>

Substitute into x+y=9:

<br>

6+y=9

<br>

y=3

<br><br>

<b>Answer: x=6, y=3</b>

</div>

<div class="example">

<b>Example 2:</b>

<br><br>

Solve:

<br>

2x + y = 11

<br>

x + y = 7

<br><br>

Subtract the second equation from the first:

<br>

x = 4

<br><br>

Substitute:

<br>

4+y=7

<br>

y=3

<br><br>

<b>x=4, y=3</b>

</div>

<div class="example">

<b>Example 3: Substitution</b>

<br><br>

Solve:

<br>

y = x + 2

<br>

2x + y = 11

<br><br>

Substitute y=x+2:

<br>

2x+x+2=11

<br>

3x=9

<br>

x=3

<br><br>

y=3+2=5

<br><br>

<b>x=3, y=5</b>

</div>

<div class="example">

<b>Example 4:</b>

<br><br>

Solve:

<br>

3x + 2y = 16

<br>

x + y = 6

<br><br>

From the second equation:

<br>

y=6−x

<br><br>

Substitute:

<br>

3x+2(6−x)=16

<br>

3x+12−2x=16

<br>

x=4

<br>

y=2

<br><br>

<b>x=4, y=2</b>

</div>

<h3>Practice Questions</h3>

<div class="question">
1. Solve x+y=10 and x−y=2.
</div>

<div class="question">
2. Solve 2x+y=9 and x+y=6.
</div>

<div class="question">
3. Solve y=x+4 and 2x+y=13.
</div>

<div class="question">
4. Solve 3x+y=14 and x+y=8.
</div>

<h3>Answers</h3>

<div class="answer">

1. x=6, y=4<br><br>

2. x=3, y=3<br><br>

3. x=3, y=7<br><br>

4. x=3, y=5

</div>
`,

"Simultaneous Equations Involving Quadratics":`

<h2>Topic 23: Simultaneous Equations Involving Quadratics</h2>

<h3>Lesson</h3>

<p>
A simultaneous equation involving a quadratic contains one equation
with a squared variable. Usually, one equation is used to express one
variable in terms of the other, and the result is substituted into the
quadratic equation.
</p>

<h3>Worked Examples</h3>

<div class="example">

<b>Example 1:</b>

<br><br>

Solve:

<br>

y = x + 1

<br>

x² + y = 7

<br><br>

Substitute y=x+1:

<br>

x²+x+1=7

<br>

x²+x−6=0

<br><br>

Factorize:

<br>

(x+3)(x−2)=0

<br><br>

Therefore:

<br>

x=−3 or x=2

<br><br>

When x=−3:

<br>

y=−3+1=−2

<br><br>

When x=2:

<br>

y=2+1=3

<br><br>

<b>Solutions:</b>

<br>

(x,y)=(-3,-2) or (2,3)

</div>

<div class="example">

<b>Example 2:</b>

<br><br>

Solve:

<br>

y=x

<br>

x²+y=12

<br><br>

Substitute y=x:

<br>

x²+x=12

<br>

x²+x−12=0

<br>

(x+4)(x−3)=0

<br><br>

x=−4 or x=3

<br><br>

Since y=x:

<br>

When x=−4, y=−4

<br>

When x=3, y=3

<br><br>

<b>Solutions: (-4,-4) and (3,3)</b>

</div>

<div class="example">

<b>Example 3:</b>

<br><br>

Solve:

<br>

x+y=5

<br>

xy=6

<br><br>

From x+y=5:

<br>

y=5−x

<br><br>

Substitute into xy=6:

<br>

x(5−x)=6

<br>

5x−x²=6

<br>

x²−5x+6=0

<br>

(x−2)(x−3)=0

<br><br>

x=2 or x=3

<br><br>

If x=2, y=3.

<br>

If x=3, y=2.

<br><br>

<b>Solutions: (2,3) and (3,2)</b>

</div>

<h3>Practice Questions</h3>

<div class="question">
1. Solve y=x+2 and x²+y=12.
</div>

<div class="question">
2. Solve y=x and x²+y=6.
</div>

<div class="question">
3. Solve x+y=7 and xy=12.
</div>

<h3>Answers</h3>

<div class="answer">

1. x=−4 or 2; corresponding y=−2 or 4.<br><br>

2. x=2 or −3; therefore y=2 or −3.<br><br>

3. The two solutions are (3,4) and (4,3).

</div>
`,

/* =====================================================
TOPIC 24
===================================================== */

"Quadratic Equations":`

<h2>Topic 24: Quadratic Equations</h2>

<h3>Lesson</h3>

<p>
A quadratic equation is an equation of the form:
</p>

<div class="formula">
ax² + bx + c = 0, where a ≠ 0
</div>

<p>
Quadratic equations can be solved by factorization, completing the
square or the quadratic formula.
</p>

<h3>Worked Examples</h3>

<div class="example">

<b>Example 1: Factorization</b>

<br><br>

Solve:

<br>

x²+5x+6=0

<br><br>

Find two numbers whose product is 6 and sum is 5.

<br>

2 and 3.

<br><br>

Therefore:

<br>

(x+2)(x+3)=0

<br><br>

x+2=0 or x+3=0

<br>

<b>x=−2 or x=−3</b>

</div>

<div class="example">

<b>Example 2:</b>

<br><br>

Solve:

<br>

x²−7x+12=0

<br><br>

Numbers with product 12 and sum −7 are −3 and −4.

<br><br>

(x−3)(x−4)=0

<br><br>

<b>x=3 or x=4</b>

</div>

<div class="example">

<b>Example 3:</b>

<br><br>

Solve:

<br>

x²−9=0

<br><br>

Difference of two squares:

<br>

(x−3)(x+3)=0

<br><br>

Therefore:

<br>

<b>x=3 or x=−3</b>

</div>

<div class="example">

<b>Example 4:</b>

<br><br>

Solve:

<br>

2x²+7x+3=0

<br><br>

Factorize:

<br>

(2x+1)(x+3)=0

<br><br>

2x+1=0

<br>

x=−1/2

<br><br>

x+3=0

<br>

x=−3

<br><br>

<b>x=−1/2 or −3</b>

</div>

<div class="example">

<b>Example 5: Word Application</b>

<br><br>

The product of two consecutive positive integers is 56.
Find the integers.

<br><br>

Let the first integer be x.

<br>

The next integer is x+1.

<br><br>

x(x+1)=56

<br>

x²+x−56=0

<br>

(x+8)(x−7)=0

<br><br>

x=−8 or x=7.

<br><br>

Since the integers are positive:

<br>

x=7

<br>

Next integer=8.

<br><br>

<b>The integers are 7 and 8.</b>

</div>

<h3>Practice Questions</h3>

<div class="question">
1. Solve x²+6x+8=0.
</div>

<div class="question">
2. Solve x²−5x+6=0.
</div>

<div class="question">
3. Solve x²−25=0.
</div>

<div class="question">
4. Solve 2x²+5x+2=0.
</div>

<div class="question">
5. Two consecutive positive integers have product 72. Find them.
</div>

<h3>Answers</h3>

<div class="answer">

1. x=−2 or −4<br><br>

2. x=2 or 3<br><br>

3. x=5 or −5<br><br>

4. x=−1/2 or −2<br><br>

5. 8 and 9

</div>
`,

/* =====================================================
TOPIC 25
===================================================== */

"Quadratic Formula":`

<h2>Topic 25: Quadratic Formula</h2>

<h3>Lesson</h3>

<p>
The quadratic formula can be used to solve any quadratic equation that
has the form:
</p>

<div class="formula">
ax² + bx + c = 0
<br><br>
x = (-b ± √(b²−4ac)) / 2a
</div>

<p>
The symbol ± means that there are normally two possible answers.
</p>

<h3>Worked Examples</h3>

<div class="example">

<b>Example 1:</b>

<br><br>

Solve:

<br>

x²−5x+6=0

<br><br>

Compare with ax²+bx+c=0:

<br>

a=1, b=−5, c=6

<br><br>

Substitute:

<br>

x = [−(−5) ± √((-5)²−4(1)(6))]/2(1)

<br><br>

x = [5 ± √(25−24)]/2

<br>

x = [5 ± 1]/2

<br><br>

x = 6/2 = 3

<br>

or

<br>

x = 4/2 = 2

<br><br>

<b>x=3 or x=2</b>

</div>

<div class="example">

<b>Example 2:</b>

<br><br>

Solve:

<br>

2x²+3x−2=0

<br><br>

a=2, b=3, c=−2

<br><br>

x = [−3 ± √(3²−4(2)(−2))]/4

<br><br>

= [−3 ± √(9+16)]/4

<br>

= [−3 ± 5]/4

<br><br>

x = 2/4 = 1/2

<br>

or

<br>

x = −8/4 = −2

<br><br>

<b>x=1/2 or −2</b>

</div>

<div class="example">

<b>Example 3:</b>

<br><br>

Solve:

<br>

x²+4x+1=0

<br><br>

a=1, b=4, c=1

<br><br>

x = [−4 ± √(4²−4(1)(1))]/2

<br><br>

= [−4 ± √12]/2

<br><br>

√12=2√3

<br><br>

Therefore:

<br>

x = [−4 ± 2√3]/2

<br>

<b>x = −2 ± √3</b>

</div>

<div class="example">

<b>Example 4: Equation with No Real Roots</b>

<br><br>

Consider:

<br>

x²+2x+5=0

<br><br>

a=1, b=2, c=5

<br><br>

b²−4ac = 4−20

<br>

= −16

<br><br>

The square root of a negative number is not a real number.

<br><br>

Therefore this equation has:

<br>

<b>No real roots.</b>

</div>

<h3>Important Steps</h3>

<ol>
<li>Write the equation in the form ax²+bx+c=0.</li>
<li>Identify a, b and c.</li>
<li>Substitute them into the quadratic formula.</li>
<li>Simplify the discriminant b²−4ac.</li>
<li>Calculate both possible values of x.</li>
</ol>

<h3>Practice Questions</h3>

<div class="question">
1. Solve x²−7x+10=0 using the quadratic formula.
</div>

<div class="question">
2. Solve 2x²−5x+2=0.
</div>

<div class="question">
3. Solve x²+6x+5=0.
</div>

<div class="question">
4. Solve x²+2x+2=0.
</div>

<div class="question">
5. Solve 3x²+2x−1=0.
</div>

<h3>Answers</h3>

<div class="answer">

1. x=5 or x=2<br><br>

2. x=2 or x=1/2<br><br>

3. x=−1 or x=−5<br><br>

4. No real roots<br><br>

5. x=1/3 or x=−1

</div>

<h3>Examination Tip</h3>

<p>
Always identify the signs of a, b and c carefully before substitution.
A common mistake is forgetting that a negative coefficient must be
entered with its negative sign.
</p>
`

};


/* =====================================================
NAVIGATION FUNCTIONS
===================================================== */

function startLearning(){
    document.getElementById("welcomeSection").classList.add("hidden");
    showTopics();
}

function showTopics(){

    document.getElementById("welcomeSection")
    .classList.add("hidden");

    document.getElementById("lessonSection")
    .classList.add("hidden");

    document.getElementById("topicsSection")
    .classList.remove("hidden");

    displayTopics();

}

function displayTopics(){

    const list=document.getElementById("topicsList");

    list.innerHTML="";

    topics.forEach(function(topic,index){

        const div=document.createElement("div");

        div.className="topic";

        div.innerHTML=(index+1)+". "+topic;

        div.onclick=function(){
            openLesson(index);
        };

        list.appendChild(div);

    });

}

function openLesson(index){

    const topic=topics[index];

    document.getElementById("welcomeSection")
    .classList.add("hidden");

    document.getElementById("topicsSection")
    .classList.add("hidden");

    document.getElementById("lessonSection")
    .classList.remove("hidden");

    document.getElementById("lessonContent").innerHTML=
        `<div class="lesson-card">${lessons[topic]}</div>`;

    window.scrollTo(0,0);

}

function showWelcome(){

    document.getElementById("topicsSection")
    .classList.add("hidden");

    document.getElementById("lessonSection")
    .classList.add("hidden");

    document.getElementById("welcomeSection")
    .classList.remove("hidden");

}

window.onload=function(){
    showWelcome();
};

</script>
