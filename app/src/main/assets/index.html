<h2>1. Number Bases</h2>
<h3>Lesson</h3>
<p>A number base tells us how many digits are used in a number system. Decimal has base 10, binary has base 2, octal has base 8 and hexadecimal has base 16.</p>

<p>In base 10, the place values are powers of 10. In base 2, the place values are powers of 2.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Convert 1011₂ to base 10.</p>
<p>1011₂ = 1(2³) + 0(2²) + 1(2¹) + 1(2⁰)</p>
<p>= 8 + 0 + 2 + 1</p>
<p><b>= 11₁₀</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Convert 13₁₀ to base 2.</p>
<p>13 ÷ 2 = 6 remainder 1</p>
<p>6 ÷ 2 = 3 remainder 0</p>
<p>3 ÷ 2 = 1 remainder 1</p>
<p>1 ÷ 2 = 0 remainder 1</p>
<p>Reading the remainders from bottom to top:</p>
<p><b>13₁₀ = 1101₂</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Convert 10101₂ to base 10.</li>
<li>Convert 15₁₀ to base 2.</li>
<li>Convert 24₁₀ to base 2.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>21₁₀</li>
<li>1111₂</li>
<li>11000₂</li>
</ol>
</div>
`;

<p>A Venn diagram represents relationships between sets using circles inside a universal set.</p>

<p>The overlapping part represents the intersection of sets.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> In a class of 40 students, 25 study Mathematics, 18 study Physics and 10 study both. Find the number who study at least one of the subjects.</p>

<p>n(M ∪ P) = n(M) + n(P) - n(M ∩ P)</p>
<p>= 25 + 18 - 10</p>
<p><b>= 33</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Using the information above, find the number who study neither.</p>
<p>Neither = 40 - 33</p>
<p><b>= 7</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>In a group of 50 students, 30 like football, 20 like basketball and 8 like both. Find how many like at least one.</li>
<li>Find how many like neither.</li>
<li>State the formula for two sets.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>42</li>
<li>8</li>
<li>n(A ∪ B) = n(A) + n(B) - n(A ∩ B)</li>
</ol>
</div>
`;

lessons["Algebraic Expressions"] = `

lessons["Expansion of Algebraic Expressions"] = `

lessons["Factorization"] = `
<h2>18. Factorization</h2>
<h3>Lesson</h3>
<p>Factorization is the process of expressing an algebraic expression as a product of factors.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Factorize 6x + 12.</p>
<p>The highest common factor is 6.</p>
<p><b>6x + 12 = 6(x + 2)</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Factorize x² + 5x + 6.</p>
<p>We need two numbers whose product is 6 and sum is 5.</p>
<p>They are 2 and 3.</p>
<p><b>x² + 5x + 6 = (x + 2)(x + 3)</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Factorize 8x + 16.</li>
<li>Factorize x² + 7x + 12.</li>
<li>Factorize x² - 9.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>8(x + 2)</li>
<li>(x + 3)(x + 4)</li>
<li>(x - 3)(x + 3)</li>
</ol>
</div>
`;

lessons["Linear Equations"] = `

lessons["Linear Inequalities"] = `

<h3>Lesson</h3>

`;lessons["Change of Subject of Formula"] = `
<h2>21. Change of Subject of Formula</h2>
<h3>Lesson</h3>
<p>Changing the subject of a formula means rearranging an equation so that a different variable is isolated on one side.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Make x the subject of y = 3x + 5.</p>
<p>y - 5 = 3x</p>
<p><b>x = (y - 5)/3</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Make r the subject of A = πr².</p>
<p>Divide by π:</p>
<p>r² = A/π</p>
<p>Take the positive square root:</p>
<p><b>r = √(A/π)</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Make x the subject of y = 2x + 7.</li>
<li>Make a the subject of v = u + at.</li>
<li>Make r the subject of C = 2πr.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>x = (y - 7)/2</li>
<li>a = (v - u)/t</li>

</ol>
</div>
`;

lessons["Simultaneous Linear Equations"] = `
<h2>22. Simultaneous Linear Equations</h2>
<h3>Lesson</h3>
<p>Simultaneous equations are equations involving two or more unknowns that must be solved together.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Solve:</p>
<p>x + y = 7</p>
<p>x - y = 1</p>

<p>Add the equations:</p>
<p>2x = 8</p>
<p><b>x = 4</b></p>

<p>Substitute into x + y = 7:</p>
<p>4 + y = 7</p>
<p><b>y = 3</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Solve:</p>
<p>2x + y = 9</p>
<p>x - y = 3</p>

<p>Add the equations:</p>
<p>3x = 12</p>
<p><b>x = 4</b></p>

<p>4 - y = 3</p>
<p><b>y = 1</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Solve x + y = 10 and x - y = 2.</li>
<li>Solve 2x + y = 8 and x - y = 1.</li>
<li>Solve 3x + y = 11 and x + y = 7.</li>
</ol>
</div>

<h3>Answers</h3>

</div>
`;

lessons["Simultaneous Equations Involving Quadratics"] = `
<h2>23. Simultaneous Equations Involving Quadratics</h2>
<h3>Lesson</h3>
<p>Some simultaneous equations contain a quadratic expression. One equation can be used to substitute for a variable in the other equation, producing a quadratic equation.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Solve:</p>
<p>y = x + 1</p>
<p>x² + y = 7</p>

<p>Substitute y = x + 1:</p>
<p>x² + x + 1 = 7</p>
<p>x² + x - 6 = 0</p>
<p>(x + 3)(x - 2) = 0</p>

<p>Therefore:</p>
<p>x = -3 or x = 2.</p>

<p>When x = -3, y = -2.</p>
<p>When x = 2, y = 3.</p>

<p><b>Solutions: (-3,-2) and (2,3)</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Solve:</p>
<p>y = 2x</p>
<p>x² + y = 15</p>

<p>x² + 2x = 15</p>
<p>x² + 2x - 15 = 0</p>
<p>(x + 5)(x - 3) = 0</p>

<p>x = -5 or x = 3.</p>

<p>Therefore:</p>
<p>x = -5 gives y = -10.</p>
<p>x = 3 gives y = 6.</p>

<p><b>Solutions: (-5,-10) and (3,6)</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Solve y = x + 2 and x² + y = 6.</li>
<li>Solve y = x and x² + y = 2.</li>
<li>Solve y = 2x and x² + y = 8.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>(-3,-1) and (1,3)</li>
<li>(-2,-2) and (1,1)</li>
<li>(-4,-8) and (2,4)</li>
</ol>
</div>
`;

lessons["Quadratic Equations"] = `
<h2>24. Quadratic Equations</h2>
<h3>Lesson</h3>
<p>A quadratic equation is an equation of the form:</p>
<p><b>ax² + bx + c = 0</b></p>
<p>where a ≠ 0.</p>

<p>Quadratic equations can be solved by factorization, completing the square or the quadratic formula.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Solve x² + 5x + 6 = 0.</p>
<p>Factorize:</p>
<p>(x + 2)(x + 3) = 0</p>
<p><b>x = -2 or x = -3</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Solve x² - 9 = 0.</p>
<p>(x - 3)(x + 3) = 0</p>
<p><b>x = 3 or x = -3</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Solve x² + 7x + 12 = 0.</li>
<li>Solve x² - 5x + 6 = 0.</li>
<li>Solve x² - 16 = 0.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>x = -3 or -4</li>
<li>x = 2 or 3</li>
<li>x = ±4</li>
</ol>
</div>
`;

lessons["Quadratic Formula"] = `
<h2>25. Quadratic Formula</h2>
<h3>Lesson</h3>
<p>The quadratic formula can be used to solve any quadratic equation written in the form ax² + bx + c = 0.</p>

<p><b>x = (-b ± √(b² - 4ac))/(2a)</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Solve x² - 5x + 6 = 0.</p>

<p>a = 1, b = -5, c = 6</p>

<p>x = [5 ± √(25 - 24)]/2</p>
<p>= [5 ± 1]/2</p>

<p><b>x = 3 or x = 2</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Solve 2x² + x - 3 = 0.</p>

<p>a = 2, b = 1, c = -3</p>

<p>x = [-1 ± √(1 + 24)]/4</p>
<p>= [-1 ± 5]/4</p>

<p><b>x = 1 or x = -3/2</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Solve x² - 7x + 12 = 0 using the quadratic formula.</li>
<li>Solve x² + 2x - 8 = 0.</li>
<li>Solve 2x² - 5x + 2 = 0.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>x = 3 or 4</li>
<li>x = 2 or -4</li>
<li>x = 2 or 1/2</li>
</ol>
</div>
`;

lessons["Completing the Square"] = `
<h2>26. Completing the Square</h2>
<h3>Lesson</h3>
<p>Completing the square is a method of solving quadratic equations and expressing a quadratic in vertex form.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Complete the square for x² + 6x + 5.</p>

<p>Take half of 6 and square it:</p>
<p>(6/2)² = 9</p>

<p>x² + 6x + 5</p>
<p>= (x + 3)² - 9 + 5</p>
<p><b>= (x + 3)² - 4</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Solve x² + 4x - 5 = 0.</p>

<p>x² + 4x = 5</p>
<p>x² + 4x + 4 = 9</p>
<p>(x + 2)² = 9</p>
<p>x + 2 = ±3</p>
<p><b>x = 1 or x = -5</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Complete the square for x² + 8x + 3.</li>
<li>Complete the square for x² - 6x + 2.</li>
<li>Solve x² + 2x - 8 = 0 by completing the square.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>(x + 4)² - 13</li>
<li>(x - 3)² - 7</li>
<li>x = 2 or -4</li>
</ol>
</div>
`;

lessons["Nature of Roots"] = `
<h2>27. Nature of Roots</h2>
<h3>Lesson</h3>
<p>The nature of the roots of a quadratic equation can be determined using the discriminant.</p>

<p>For ax² + bx + c = 0:</p>
<p><b>Discriminant = b² - 4ac</b></p>

<ul>
<li>If b² - 4ac &gt; 0, there are two distinct real roots.</li>
<li>If b² - 4ac = 0, there are two equal real roots.</li>
<li>If b² - 4ac &lt; 0, there are no real roots.</li>
</ul>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Determine the nature of the roots of x² - 5x + 6 = 0.</p>
<p>D = (-5)² - 4(1)(6)</p>
<p>= 25 - 24</p>
<p><b>= 1</b></p>
<p>Since D &gt; 0, there are two distinct real roots.</p>
</div>

<div class="example">
<p><b>Example 2:</b> Determine the nature of the roots of x² + 4x + 4 = 0.</p>
<p>D = 4² - 4(1)(4)</p>
<p>= 16 - 16</p>
<p><b>= 0</b></p>
<p>Therefore the roots are equal.</p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the discriminant of x² + 3x + 2 = 0.</li>
<li>State the nature of the roots when D = -5.</li>
<li>State the nature of the roots when D = 25.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1</li>
<li>No real roots.</li>
<li>Two distinct real roots.</li>
</ol>
</div>
`;

lessons["Sequence"] = `
<h2>28. Sequence</h2>
<h3>Lesson</h3>
<p>A sequence is an ordered list of numbers following a particular pattern or rule.</p>

<p>The numbers in a sequence are called terms.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the next two terms of 2, 5, 8, 11, ...</p>
<p>The common difference is 3.</p>
<p>11 + 3 = 14</p>
<p>14 + 3 = 17</p>
<p><b>Next terms: 14, 17</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the nth term of 4, 7, 10, 13, ...</p>
<p>a = 4 and d = 3.</p>
<p>Tₙ = a + (n - 1)d</p>
<p>= 4 + 3(n - 1)</p>
<p><b>Tₙ = 3n + 1</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the next two terms: 5, 10, 15, 20, ...</li>
<li>Find the next term: 3, 6, 12, 24, ...</li>
<li>Find the nth term of 2, 5, 8, 11, ...</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>25, 30</li>
<li>48</li>
<li>3n - 1</li>
</ol>
</div>
`;

lessons["Arithmetic Progression"] = `
<h2>29. Arithmetic Progression</h2>
<h3>Lesson</h3>
<p>An arithmetic progression (AP) is a sequence in which the difference between consecutive terms is constant.</p>

<p>The nth term is:</p>
<p><b>Tₙ = a + (n - 1)d</b></p>

<p>where a is the first term and d is the common difference.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the 10th term of 3, 7, 11, 15, ...</p>
<p>a = 3, d = 4</p>
<p>T₁₀ = 3 + (10 - 1)4</p>
<p>= 3 + 36</p>
<p><b>= 39</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the common difference of 20, 17, 14, 11, ...</p>
<p>d = 17 - 20</p>
<p><b>d = -3</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the 8th term of 2, 5, 8, ...</li>
<li>Find the common difference of 12, 9, 6, 3, ...</li>
<li>Find the 15th term of 5, 9, 13, ...</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>23</li>
<li>-3</li>
<li>61</li>
</ol>
</div>
`;

lessons["Geometric Progression"] = `
<h2>30. Geometric Progression</h2>
<h3>Lesson</h3>
<p>A geometric progression (GP) is a sequence in which each term is obtained by multiplying the previous term by a constant ratio.</p>

<p>The nth term is:</p>
<p><b>Tₙ = arⁿ⁻¹</b></p>

<p>where a is the first term and r is the common ratio.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the 5th term of 2, 6, 18, 54, ...</p>
<p>a = 2, r = 3</p>

<p>= 2 × 81</p>
<p><b>= 162</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the common ratio of 5, 15, 45, 135, ...</p>
<p>r = 15/5</p>
<p><b>r = 3</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the next term of 3, 6, 12, 24, ...</li>
<li>Find the common ratio of 4, 12, 36, ...</li>
<li>Find the 4th term of 2, 10, 50, ...</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>48</li>
<li>3</li>
<li>250</li>
</ol>
</div>
`;

lessons["Sum of Series"] = `
<h2>31. Sum of Series</h2>
<h3>Lesson</h3>
<p>A series is formed by adding the terms of a sequence.</p>

<p>For an arithmetic progression:</p>
<p><b>Sₙ = n/2[2a + (n - 1)d]</b></p>

<p>It can also be written as:</p>
<p><b>Sₙ = n/2(a + l)</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the sum of the first 15 positive integers.</p>
<p>S = 15/2(1 + 15)</p>
<p>= 15/2 × 16</p>
<p><b>= 120</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the sum of the first 10 terms of 3, 6, 9, ...</p>
<p>a = 3, d = 3, n = 10</p>
<p>S₁₀ = 10/2[2(3) + 9(3)]</p>
<p>= 5(33)</p>
<p><b>= 165</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the sum of the first 20 positive integers.</li>
<li>Find the sum of 2 + 5 + 8 + ... + 29.</li>
<li>Find the sum of the first 10 terms of 4, 8, 12, ...</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>210</li>
<li>155</li>
<li>220</li>
</ol>
</div>
`;

lessons["Binomial Expansion"] = `
<h2>32. Binomial Expansion</h2>
<h3>Lesson</h3>
<p>A binomial is an algebraic expression containing two terms. Binomial expansion expresses a power of a binomial as a sum of terms.</p>

<p>For example:</p>
<p><b>(a + b)² = a² + 2ab + b²</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Expand (x + 2)².</p>
<p>= x² + 4x + 4</p>
<p><b>Answer = x² + 4x + 4</b></p>
</div>

lessons["Partial Fractions"] = `
<h2>33. Partial Fractions</h2>
<h3>Lesson</h3>
<p>Partial fractions involve expressing a rational algebraic expression as a sum of simpler fractions.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Express:</p>
<p>5/[(x+1)(x+2)]</p>
<p>as A/(x+1) + B/(x+2).</p>

<p>5 = A(x+2) + B(x+1)</p>

<p>Putting x = -1:</p>
<p>5 = A</p>

<p>Putting x = -2:</p>
<p>5 = -B, so B = -5.</p>

<p><b>Therefore 5/[(x+1)(x+2)] = 5/(x+1) - 5/(x+2)</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Express:</p>
<p>3/[(x+1)(x+3)]</p>

<p>Let:</p>
<p>3/(x+1)(x+3) = A/(x+1) + B/(x+3)</p>

<p>3 = A(x+3) + B(x+1)</p>

<p>x = -1 gives A = 3/2.</p>
<p>x = -3 gives B = -3/2.</p>

<p><b>Answer = 3/[2(x+1)] - 3/[2(x+3)]</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Express 1/[(x+1)(x+2)] in partial fractions.</li>
<li>Express 4/[(x+2)(x+4)] in partial fractions.</li>
<li>Why are partial fractions useful?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1/(x+1) - 1/(x+2)</li>
<li>2/(x+2) - 2/(x+4)</li>
<li>They break complicated rational expressions into simpler fractions.</li>
</ol>
</div>
`;

lessons["Multiplication of Matrices"] = `

lessons["Inverse of a Matrix"] = `
<h2>40. Inverse of a Matrix</h2>
<h3>Lesson</h3>
<p>The inverse of a square matrix A is written as A⁻¹. It satisfies:</p>

<p><b>AA⁻¹ = A⁻¹A = I</b></p>

<p>For:</p>

<p>A = [a b]</p>
<p>    [c d]</p>

<p>the inverse is:</p>

<p><b>A⁻¹ = 1/(ad-bc) [d -b; -c a]</b></p>

<p>The determinant must not be zero.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the inverse of:</p>
<p>A = [2 1]</p>
<p>    [1 1]</p>

<p>det(A) = 2(1) - 1(1) = 1</p>

<p>A⁻¹ = [1 -1]</p>
<p>      [-1 2]</p>

<p><b>Answer: [1 -1; -1 2]</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the inverse of:</p>
<p>A = [3 1]</p>
<p>    [2 1]</p>

<p>det(A) = 3(1) - 1(2) = 1</p>

<p>A⁻¹ = [1 -1]</p>
<p>      [-2 3]</p>

<p><b>Answer: [1 -1; -2 3]</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the determinant of [4 1; 2 1].</li>
<li>Find the inverse of [2 1; 1 1].</li>

</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>2</li>
<li>[1 -1; -1 2]</li>

</ol>
</div>

<p><b>Example 2:</b> An isosceles triangle has equal angles of 40°. Find the third angle.</p>
<p>Third angle = 180° - 40° - 40°</p>
<p><b>= 100°</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the third angle of a triangle with angles 45° and 65°.</li>
<li>Find each base angle of an isosceles triangle whose vertex angle is 40°.</li>
<li>What is the sum of the interior angles of a triangle?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>70°</li>
<li>70° each</li>
<li>180°</li>
</ol>
</div>
`;

lessons["Quadrilaterals"] = `
<h2>51. Quadrilaterals</h2>
<h3>Lesson</h3>

<h3>Worked Examples</h3>

</ol>

<h3>Answers</h3>

`;

lessons["Polygons"] = `
<h2>52. Polygons</h2>
<h3>Lesson</h3>
<p>A polygon is a closed plane figure made up of straight line segments.</p>

<p>The sum of the interior angles of an n-sided polygon is:</p>
<p><b>(n - 2) × 180°</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the sum of the interior angles of a pentagon.</p>
<p>n = 5</p>
<p>Sum = (5 - 2) × 180°</p>
<p><b>= 540°</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find each interior angle of a regular hexagon.</p>
<p>Sum = (6 - 2) × 180° = 720°</p>
<p>Each angle = 720° ÷ 6</p>
<p><b>= 120°</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the sum of the interior angles of a hexagon.</li>
<li>Find each interior angle of a regular pentagon.</li>
<li>How many sides does a polygon have if its interior angle sum is 900°?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>720°</li>
<li>108°</li>
<li>7 sides</li>
</ol>
</div>
`;

lessons["Circles"] = `
<h2>53. Circles</h2>
<h3>Lesson</h3>
<p>A circle is a set of points that are all the same distance from a fixed point called the centre.</p>

<p>The distance from the centre to the circumference is the radius. The diameter is twice the radius.</p>

<p><b>d = 2r</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the diameter of a circle with radius 7 cm.</p>

<p><b>d = 14 cm</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the circumference of a circle with radius 5 cm.</p>

<p><b>C = 10π cm</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>

</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>18 cm</li>
<li>10 cm</li>
<li>C = 2πr</li>
</ol>
</div>
`;

lessons["Circle Theorems"] = `
<h2>54. Circle Theorems</h2>
<h3>Lesson</h3>
<p>Circle theorems describe relationships between angles, chords, arcs and the centre of a circle.</p>

<p>Important theorems include:</p>
<ul>
<li>The angle at the centre is twice the angle at the circumference standing on the same arc.</li>
<li>Angles in the same segment are equal.</li>
<li>The angle in a semicircle is 90°.</li>
<li>Opposite angles of a cyclic quadrilateral add to 180°.</li>
</ul>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> An angle at the circumference is 35°. Find the angle at the centre standing on the same arc.</p>
<p>Centre angle = 2 × 35°</p>
<p><b>= 70°</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> One angle of a cyclic quadrilateral is 110°. Find the opposite angle.</p>
<p>Opposite angles add to 180°.</p>
<p>180° - 110° = <b>70°</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>An angle at the circumference is 40°. Find the angle at the centre on the same arc.</li>
<li>What is the angle in a semicircle?</li>
<li>A cyclic quadrilateral has one angle of 85°. Find the opposite angle.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>80°</li>
<li>90°</li>
<li>95°</li>
</ol>
</div>
`;

lessons["Mensuration of Plane Shapes"] = `

`;

lessons["Perimeter and Area"] = `
<h2>56. Perimeter and Area</h2>
<h3>Lesson</h3>

<h3>Worked Examples</h3>
<div class="example">

<h3>Practice Questions</h3>

<h3>Answers</h3>

`;

lessons["Mensuration of Solids"] = `
<h2>57. Mensuration of Solids</h2>
<h3>Lesson</h3>
<p>Mensuration of solids involves finding measurements such as surface area and volume of three-dimensional objects.</p>

<p>Common solids include cubes, cuboids, cylinders, prisms, cones and spheres.</p>

<h3>Worked Examples</h3>

lessons["Surface Area of Solids"] = `

lessons["Volume of Solids"] = `

lessons["Coordinate Geometry"] = `

`lessons["Straight Lines"] = `

lessons["Graphs of Linear Equations"] = `

lessons["Gradient of a Straight Line"] = `
<h2>63. Gradient of a Straight Line</h2>
<h3>Lesson</h3>
<p>The gradient measures the steepness of a straight line.</p>
<p>For two points (x₁,y₁) and (x₂,y₂):</p>

lessons["Distance Between Two Points"] = `

lessons["Variation"] = `
<h2>65. Variation</h2>
<h3>Lesson</h3>
<p>Variation describes how one quantity changes in relation to another quantity.</p>
<p>The main types are direct, inverse, joint and partial variation.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If y varies directly as x and y = 12 when x = 3, find y when x = 5.</p>
<p>y = kx</p>
<p>12 = 3k</p>
<p>k = 4</p>
<p>Therefore y = 4x.</p>
<p>When x = 5:</p>
<p><b>y = 20</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If y varies inversely as x and y = 6 when x = 2, find y when x = 3.</p>
<p>y = k/x</p>
<p>6 = k/2</p>
<p>k = 12</p>
<p>When x = 3:</p>
<p><b>y = 4</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If y varies directly as x and y = 15 when x = 5, find y when x = 8.</li>
<li>If y varies inversely as x and y = 10 when x = 2, find y when x = 5.</li>
<li>Name two types of variation.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>24</li>
<li>4</li>
<li>Direct variation and inverse variation.</li>
</ol>
</div>
`;

lessons["Direct Variation"] = `
<h2>66. Direct Variation</h2>
<h3>Lesson</h3>
<p>In direct variation, one quantity is directly proportional to another.</p>
<p>It is written as:</p>
<p><b>y = kx</b></p>
<p>where k is the constant of proportionality.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> y varies directly as x. If y = 18 when x = 6, find y when x = 10.</p>
<p>18 = 6k</p>
<p>k = 3</p>
<p>y = 3x</p>
<p>When x = 10:</p>
<p><b>y = 30</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If y = 5x, find y when x = 7.</p>
<p>y = 5(7)</p>
<p><b>y = 35</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If y varies directly as x and y = 20 when x = 4, find the constant k.</li>
<li>If y = 7x, find y when x = 9.</li>
<li>If y = 24 when x = 8 under direct variation, find y when x = 12.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>5</li>
<li>63</li>
<li>36</li>
</ol>
</div>
`;

lessons["Inverse Variation"] = `
<h2>67. Inverse Variation</h2>
<h3>Lesson</h3>
<p>In inverse variation, one quantity increases as the other decreases.</p>
<p>The relationship is:</p>
<p><b>y = k/x</b></p>
<p>or <b>xy = k</b>.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> y varies inversely as x. If y = 12 when x = 2, find y when x = 8.</p>
<p>xy = k</p>
<p>2 × 12 = 24</p>
<p>Therefore k = 24.</p>
<p>y = 24/8</p>
<p><b>y = 3</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If xy = 30 and x = 5, find y.</p>
<p>5y = 30</p>
<p><b>y = 6</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If y varies inversely as x and y = 8 when x = 3, find k.</li>
<li>If xy = 40 and x = 8, find y.</li>
<li>If xy = 60 and x = 12, find y.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>24</li>
<li>5</li>
<li>5</li>
</ol>
</div>
`;

lessons["Joint Variation"] = `
<h2>68. Joint Variation</h2>
<h3>Lesson</h3>
<p>Joint variation occurs when one quantity varies directly as the product of two or more other quantities.</p>

<p>For example:</p>
<p><b>z = kxy</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> z varies jointly as x and y. If z = 24 when x = 2 and y = 3, find z when x = 4 and y = 5.</p>
<p>z = kxy</p>
<p>24 = k(2)(3)</p>
<p>k = 4</p>
<p>Therefore z = 4xy.</p>
<p>When x = 4 and y = 5:</p>

<p><b>z = 80</b></p>

<p>z = 3 × 2 × 7</p>
<p><b>z = 42</b></p>
</div>

<h3>Practice Questions</h3>

</div>

<h3>Answers</h3>
<div class="answer">

</div>
`;

lessons["Partial Variation"] = `
<h2>69. Partial Variation</h2>
<h3>Lesson</h3>
<p>Partial variation occurs when one quantity varies directly with another quantity but also has a constant part.</p>

<p>It is commonly written as:</p>
<p><b>y = a + bx</b></p>

<p>Here, a is the constant part and bx is the variable part.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> y = 5 + 2x. Find y when x = 4.</p>
<p>y = 5 + 2(4)</p>

<p><b>= 13</b></p>
</div>

<div class="example">

<p>Fare = 500 + 200(6)</p>
<p><b>= ₦1,700</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find y when y = 7 + 3x and x = 5.</li>
<li>If y = 10 + 4x, find y when x = 6.</li>
<li>In y = a + bx, which term represents the constant part?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>22</li>
<li>34</li>
<li>a</li>
</ol>
</div>
`;

lessons["Trigonometry"] = `

<h3>Lesson</h3>

lessons["Trigonometric Identities"] = `
<h2>73. Trigonometric Identities</h2>
<h3>Lesson</h3>
<p>A trigonometric identity is an equation involving trigonometric functions that is true for all values for which both sides are defined.</p>

<p>Important identities include:</p>
<p><b>sin²θ + cos²θ = 1</b></p>
<p><b>tan θ = sin θ/cos θ</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If sin θ = 3/5 and θ is acute, find cos θ.</p>
<p>sin²θ + cos²θ = 1</p>
<p>9/25 + cos²θ = 1</p>
<p>cos²θ = 16/25</p>
<p><b>cos θ = 4/5</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If sin θ = 3/5 and cos θ = 4/5, find tan θ.</p>
<p>tan θ = sin θ/cos θ</p>
<p>= (3/5)/(4/5)</p>
<p><b>= 3/4</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Complete: sin²θ + cos²θ = □.</li>
<li>If sin θ = 5/13 and θ is acute, find cos θ.</li>
<li>If sin θ = 3/4 and cos θ = 1/2, find tan θ.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1</li>
<li>12/13</li>
<li>3/2</li>
</ol>
</div>
`;

lessons["Sine Rule"] = `
<h2>74. Sine Rule</h2>
<h3>Lesson</h3>
<p>The sine rule is used in non-right-angled triangles when suitable pairs of sides and opposite angles are known.</p>

<p><b>a/sin A = b/sin B = c/sin C</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> In a triangle, a = 8 cm, A = 30° and B = 45°. Find b.</p>
<p>8/sin 30° = b/sin 45°</p>

<p><b>b = 8√2 cm</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If a = 10 cm, A = 30° and B = 60°, find b.</p>
<p>b = 10(sin 60°)/(sin 30°)</p>
<p><b>b = 10√3 cm</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If a = 6 cm, A = 30° and B = 90°, find b.</li>
<li>If a = 5 cm, A = 30° and B = 60°, find b.</li>

</ol>
</div>

<h3>Answers</h3>

</ol>
</div>
`;

lessons["Cosine Rule"] = `
<h2>75. Cosine Rule</h2>
<h3>Lesson</h3>
<p>The cosine rule can be used to find an unknown side or angle in a non-right-angled triangle.</p>

<p><b>a² = b² + c² - 2bc cos A</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find a when b = 5 cm, c = 6 cm and A = 60°.</p>
<p>a² = 5² + 6² - 2(5)(6)cos60°</p>
<p>= 25 + 36 - 60(1/2)</p>
<p>= 31</p>
<p><b>a = √31 cm</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the angle A when a = 5, b = 3 and c = 4.</p>
<p>5² = 3² + 4² - 2(3)(4)cos A</p>
<p>25 = 25 - 24cos A</p>
<p>cos A = 0</p>
<p><b>A = 90°</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find a when b = 3, c = 4 and A = 90°.</li>
<li>Find a when b = 5, c = 5 and A = 60°.</li>
<li>Write the cosine rule for side a.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>5</li>
<li>5</li>
<li>a² = b² + c² - 2bc cos A</li>
</ol>
</div>
`;

</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>2</li>
<li>7</li>
<li>No mode.</li>
</ol>
</div>
`;

lessons["Measures of Dispersion"] = `
<h2>88. Measures of Dispersion</h2>
<h3>Lesson</h3>
<p>Measures of dispersion describe how spread out the values in a data set are.</p>
<p>Important measures include range, variance and standard deviation.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the range of 2, 5, 8, 10.</p>
<p>Range = largest value - smallest value</p>
<p>= 10 - 2</p>
<p><b>= 8</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Which measure of dispersion is obtained by taking the square root of variance?</p>
<p><b>Standard deviation.</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Name three measures of dispersion.</li>
<li>Find the range of 3, 7, 10, 15.</li>
<li>What is the square root of variance called?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>Range, variance and standard deviation.</li>
<li>12</li>
<li>Standard deviation.</li>
</ol>
</div>
`;

lessons["Range"] = `
<h2>89. Range</h2>
<h3>Lesson</h3>
<p>The range is the difference between the largest and smallest values in a data set.</p>
<p><b>Range = Maximum - Minimum</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the range of 4, 8, 10, 15.</p>
<p>Range = 15 - 4</p>
<p><b>= 11</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the range of 12, 20, 25 and 30.</p>
<p>Range = 30 - 12</p>
<p><b>= 18</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the range of 2, 5, 9, 12.</li>
<li>Find the range of 10, 15, 20, 25.</li>
<li>Find the range of 4, 7, 13, 18.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>

<li>15</li>
<li>14</li>
</ol>
</div>
`;

lessons["Variance"] = `
<h2>90. Variance</h2>
<h3>Lesson</h3>
<p>Variance measures how far observations are spread around their mean.</p>
<p>For a population, variance can be calculated using:</p>
<p><b>Variance = Σ(x - mean)² ÷ n</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the variance of 2, 4, 6.</p>
<p>Mean = 4.</p>
<p>Squared deviations:</p>
<p>(2-4)² = 4</p>
<p>(4-4)² = 0</p>
<p>(6-4)² = 4</p>
<p>Variance = (4 + 0 + 4) ÷ 3</p>
<p><b>= 8/3</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the variance of 5, 5, 5.</p>
<p>Mean = 5.</p>
<p>Every deviation from the mean is zero.</p>
<p><b>Variance = 0</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the variance of 3, 3, 3.</li>
<li>Find the variance of 1, 2, 3 using the population formula.</li>
<li>What does variance measure?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>0</li>
<li>2/3</li>
<li>The spread of observations around their mean.</li>
</ol>
</div>
`;

lessons["Standard Deviation"] = `
<h2>91. Standard Deviation</h2>
<h3>Lesson</h3>
<p>Standard deviation measures the spread of data and is the positive square root of variance.</p>

<p><b>Standard deviation = √Variance</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If the variance is 25, find the standard deviation.</p>
<p>Standard deviation = √25</p>
<p><b>= 5</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If the variance is 16, find the standard deviation.</p>
<p>Standard deviation = √16</p>
<p><b>= 4</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If variance = 9, find the standard deviation.</li>
<li>If variance = 36, find the standard deviation.</li>
<li>If variance = 49, find the standard deviation.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>3</li>
<li>6</li>
<li>7</li>
</ol>
</div>
`;

lessons["Probability"] = `
<h2>92. Probability</h2>
<h3>Lesson</h3>
<p>Probability measures the likelihood of an event occurring.</p>
<p>For equally likely outcomes:</p>
<p><b>P(E) = Number of favourable outcomes ÷ Total number of outcomes</b></p>
<p>Probability ranges from 0 to 1.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> A fair die is thrown. Find the probability of getting a 4.</p>
<p>There is one favourable outcome out of six.</p>
<p><b>P(4) = 1/6</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> A bag contains 3 red balls and 2 blue balls. Find the probability of selecting a red ball.</p>
<p>Total balls = 5.</p>
<p>Red balls = 3.</p>
<p><b>P(red) = 3/5</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the probability of getting a head when a fair coin is tossed.</li>
<li>Find the probability of getting an even number on a fair die.</li>
<li>What is the probability of an impossible event?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1/2</li>
<li>1/2</li>
<li>0</li>
</ol>
</div>
`;

lessons["Experimental Probability"] = `
<h2>93. Experimental Probability</h2>
<h3>Lesson</h3>
<p>Experimental probability is based on results obtained from an actual experiment.</p>
<p><b>Experimental probability = Number of times event occurs ÷ Total number of trials</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> A coin is tossed 50 times and heads occur 28 times.</p>
<p>P(heads) = 28/50</p>
<p><b>= 14/25</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> A die is thrown 60 times and a 6 occurs 12 times.</p>
<p>P(6) = 12/60</p>
<p><b>= 1/5</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>A coin is tossed 40 times and heads occur 18 times. Find the experimental probability of heads.</li>
<li>A die is thrown 50 times and a 5 occurs 10 times. Find the experimental probability.</li>
<li>What is experimental probability based on?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>9/20</li>
<li>1/5</li>
<li>Results from an actual experiment.</li>
</ol>
</div>
`;

lessons["Theoretical Probability"] = `
<h2>94. Theoretical Probability</h2>
<h3>Lesson</h3>
<p>Theoretical probability is calculated using the possible outcomes of an experiment without carrying out the experiment.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the probability of rolling a 6 on a fair die.</p>
<p>There are 6 equally likely outcomes and one favourable outcome.</p>
<p><b>P(6) = 1/6</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the probability of drawing a heart from a standard deck of 52 cards.</p>
<p>There are 13 hearts.</p>
<p>P(heart) = 13/52</p>
<p><b>= 1/4</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the probability of rolling an odd number on a fair die.</li>
<li>Find the probability of drawing an ace from a standard deck of 52 cards.</li>
<li>Find the probability of getting tails from a fair coin.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1/2</li>
<li>1/13</li>
<li>1/2</li>
</ol>
</div>
`;

lessons["Permutation"] = `
<h2>95. Permutation</h2>
<h3>Lesson</h3>
<p>A permutation is an arrangement of objects where order matters.</p>
<p>The number of arrangements of n distinct objects is:</p>
<p><b>n! = n × (n-1) × ... × 2 × 1</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find 4!.</p>
<p>4! = 4 × 3 × 2 × 1</p>
<p><b>= 24</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> In how many ways can 3 different books be arranged on a shelf?</p>
<p>3! = 3 × 2 × 1</p>
<p><b>= 6 ways</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find 5!.</li>
<li>In how many ways can 4 different books be arranged?</li>
<li>Does order matter in a permutation?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>120</li>
<li>24 ways</li>
<li>Yes.</li>
</ol>
</div>
`;

lessons["Combination"] = `
<h2>96. Combination</h2>
<h3>Lesson</h3>
<p>A combination is a selection of objects where order does not matter.</p>
<p>The formula is:</p>
<p><b>nCr = n! ÷ [r!(n-r)!]</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find 5C2.</p>
<p>5C2 = 5! ÷ (2!3!)</p>
<p>= 10</p>
<p><b>Answer = 10</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find 6C3.</p>
<p>6C3 = 6! ÷ (3!3!)</p>
<p><b>= 20</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find 4C2.</li>
<li>Find 5C3.</li>
<li>Does order matter in a combination?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>6</li>
<li>10</li>
<li>No.</li>
</ol>
</div>
`;

lessons["Probability of Combined Events"] = `
<h2>97. Probability of Combined Events</h2>
<h3>Lesson</h3>
<p>Combined events involve two or more events. For independent events, the probability that both occur is found by multiplying their probabilities.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> A fair coin is tossed twice. Find the probability of getting two heads.</p>
<p>P(H) = 1/2.</p>
<p>P(two heads) = 1/2 × 1/2</p>
<p><b>= 1/4</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> A fair die is thrown twice. Find the probability of getting a 6 on both throws.</p>
<p>P(6) = 1/6.</p>
<p>P(two sixes) = 1/6 × 1/6</p>
<p><b>= 1/36</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>A fair coin is tossed twice. Find the probability of two tails.</li>
<li>A fair die is thrown twice. Find the probability of getting two 5s.</li>
<li>What operation is used to find the probability of independent events both occurring?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>1/4</li>
<li>1/36</li>
<li>Multiplication.</li>
</ol>
</div>
`;

lessons["Introduction to Calculus"] = `
<h2>98. Introduction to Calculus</h2>
<h3>Lesson</h3>
<p>Calculus is a branch of mathematics concerned mainly with change and accumulation.</p>
<p>The two major areas are <b>differentiation</b> and <b>integration</b>.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If y = x², differentiation gives:</p>
<p>dy/dx = 2x.</p>
<p><b>Therefore dy/dx = 2x.</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> The integral of x is:</p>
<p>∫x dx = x²/2 + C</p>
<p><b>Answer = x²/2 + C</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Name the two major areas of calculus.</li>
<li>Differentiate y = x³.</li>
<li>Find ∫x² dx.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>Differentiation and integration.</li>
<li>3x²</li>
<li>x³/3 + C</li>
</ol>
</div>
`;

lessons["Functions"] = `
<h2>99. Functions</h2>
<h3>Lesson</h3>
<p>A function is a rule that assigns each input exactly one output.</p>
<p>It is often written as <b>f(x)</b>.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If f(x) = 2x + 3, find f(4).</p>
<p>f(4) = 2(4) + 3</p>
<p><b>= 11</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If f(x) = x² - 1, find f(5).</p>
<p>f(5) = 25 - 1</p>
<p><b>= 24</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If f(x) = 3x + 2, find f(5).</li>
<li>If f(x) = x² + 1, find f(4).</li>
<li>If f(x) = 2x - 7, find f(6).</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>17</li>
<li>17</li>
<li>5</li>
</ol>
</div>
`;

lessons["Domain and Range"] = `
<h2>100. Domain and Range</h2>
<h3>Lesson</h3>
<p>The <b>domain</b> of a function is the set of permitted input values.</p>
<p>The <b>range</b> is the set of resulting output values.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> For f(x) = x + 2 with domain {1,2,3}, find the range.</p>
<p>f(1) = 3</p>
<p>f(2) = 4</p>
<p>f(3) = 5</p>
<p><b>Range = {3,4,5}</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> For f(x) = 2x with domain {1,2,4}, find the range.</p>
<p>Outputs are 2, 4 and 8.</p>
<p><b>Range = {2,4,8}</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>For f(x)=x+1 and domain {1,2,3}, find the range.</li>
<li>For f(x)=3x and domain {1,2}, find the range.</li>
<li>What is the domain of a function?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>{2,3,4}</li>
<li>{3,6}</li>
<li>The set of permitted input values.</li>
</ol>
</div>
`;lessons["Composite Functions"] = `
<h2>101. Composite Functions</h2>
<h3>Lesson</h3>
<p>A composite function is formed when one function is applied after another.</p>
<p>It is written as <b>(fg)(x) = f(g(x))</b>.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> If f(x) = 2x + 1 and g(x) = x + 3, find f(g(x)).</p>
<p>f(g(x)) = 2(x + 3) + 1</p>
<p>= 2x + 6 + 1</p>
<p><b>= 2x + 7</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If f(x) = x² and g(x) = x + 1, find f(g(2)).</p>
<p>g(2) = 3</p>
<p>f(3) = 9</p>
<p><b>f(g(2)) = 9</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>If f(x)=3x and g(x)=x+2, find f(g(x)).</li>
<li>If f(x)=x+4 and g(x)=2x, find f(g(x)).</li>
<li>If f(x)=x² and g(x)=x+2, find f(g(1)).</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>3x + 6</li>
<li>2x + 4</li>
<li>9</li>
</ol>
</div>
`;

lessons["Inverse Functions"] = `
<h2>102. Inverse Functions</h2>
<h3>Lesson</h3>
<p>An inverse function reverses the operation of the original function.</p>
<p>The inverse of f(x) is written as <b>f⁻¹(x)</b>.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the inverse of f(x)=2x+3.</p>
<p>Let y = 2x + 3.</p>
<p>Swap x and y:</p>
<p>x = 2y + 3</p>
<p>x - 3 = 2y</p>
<p><b>f⁻¹(x) = (x - 3)/2</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Find the inverse of f(x)=x+5.</p>
<p>y = x + 5</p>
<p>x = y + 5</p>
<p><b>f⁻¹(x) = x - 5</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the inverse of f(x)=x+4.</li>
<li>Find the inverse of f(x)=3x.</li>
<li>Find the inverse of f(x)=2x-6.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>f⁻¹(x)=x-4</li>
<li>f⁻¹(x)=x/3</li>
<li>f⁻¹(x)=(x+6)/2</li>
</ol>
</div>
`;

lessons["Limits"] = `
<h2>103. Limits</h2>
<h3>Lesson</h3>
<p>A limit describes the value that a function approaches as the input approaches a particular value.</p>

<h3>Worked Examples</h3>
<div class="example">

</div>
`;

lessons["Differentiation"] = `
<h2>104. Differentiation</h2>
<h3>Lesson</h3>
<p>Differentiation is the process of finding the derivative of a function.</p>
<p>The derivative describes the rate at which a quantity changes.</p>

<h3>Worked Examples</h3>
<div class="example">

<p>dy/dx = <b>2x</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Differentiate y=x³.</p>

<h3>Practice Questions</h3>

</ol>
</div>
`;

lessons["Differentiation from First Principles"] = `
<h2>105. Differentiation from First Principles</h2>
<h3>Lesson</h3>
<p>The derivative from first principles is defined by:</p>
<p><b>f'(x) = lim[h→0] [f(x+h)-f(x)]/h</b></p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Use first principles to differentiate f(x)=x².</p>
<p>f(x+h) = (x+h)²</p>
<p>= x² + 2xh + h²</p>
<p>Therefore:</p>
<p>[f(x+h)-f(x)]/h = 2x + h</p>
<p>As h approaches 0:</p>
<p><b>f'(x)=2x</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> Use first principles for f(x)=x³.</p>
<p>Expanding (x+h)³ and simplifying gives:</p>
<p>3x² + 3xh + h².</p>
<p>As h approaches 0:</p>
<p><b>f'(x)=3x²</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Using first principles, find the derivative of x².</li>
<li>Using first principles, find the derivative of x³.</li>
<li>What value does h approach in the first-principles definition?</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>2x</li>
<li>3x²</li>
<li>0</li>
</ol>
</div>
`;

lessons["Rules of Differentiation"] = `

`;

lessons["Applications of Differentiation"] = `
<h2>107. Applications of Differentiation</h2>
<h3>Lesson</h3>
<p>Differentiation can be used to find gradients, rates of change, stationary points and maximum or minimum values.</p>

<h3>Worked Examples</h3>
<div class="example">
<p><b>Example 1:</b> Find the gradient of y=x² at x=3.</p>
<p>dy/dx = 2x</p>
<p>At x=3:</p>
<p><b>gradient = 6</b></p>
</div>

<div class="example">
<p><b>Example 2:</b> If s=t²+3t, find the rate of change of s when t=2.</p>
<p>ds/dt = 2t + 3</p>
<p>At t=2:</p>
<p>ds/dt = 4 + 3</p>
<p><b>= 7</b></p>
</div>

<h3>Practice Questions</h3>
<div class="practice">
<ol>
<li>Find the gradient of y=x² at x=4.</li>

<li>Find the rate of change of s=t³ at t=2.</li>
</ol>
</div>

<h3>Answers</h3>
<div class="answer">
<ol>
<li>8</li>
<li>6x</li>
<li>12</li>
</ol>
</div>
`;

<h2>108. Maximum and Minimum Values</h2>

<p>2x - 4 = 0</p>
<p>x = 2</p>

<div class="example">

<p>dy/dx = -2x + 6</p>
<p>-2x + 6 = 0</p>
<p>x = 3</p>
<p>y = -9 + 18 = 9</p>
<p><b>Stationary point = (3,9)</b></p>

    document.getElementById("welcomeSection").classList.add("hidden");

    document.getElementById("lessonSection").classList.remove("hidden");

    document.getElementById("lessonContent").innerHTML =
        lessons[topic] || "<h2>Lesson not found.</h2>";

    window.scrollTo(0,0);
}
