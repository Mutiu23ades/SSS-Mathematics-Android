name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check generated APK
        run: |
          echo "APK files found:"
          find app/build/outputs -type f
          echo ""
          echo "APK size:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo ""
          echo "APK contents:"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-Mathematics-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
